name: Refresh daily APIx data

on:
  schedule:
    # 00:00 India Standard Time = 18:30 UTC on the previous day.
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      route_limit:
        description: "Temporary route limit for diagnostics; 0 runs all routes"
        required: false
        default: "0"
      top_routes:
        description: "Highest-passenger-volume routes to run; 0 disables ranking"
        required: false
        default: "0"
      offsets:
        description: "Comma-separated advance-purchase offsets, for example 1 or 1,7,15,30,45"
        required: false
        default: "1,7,15,30,45"
      debug_empty_results:
        description: "Log one diagnostic line for each route returning empty results"
        required: false
        default: false
        type: boolean
      scrape_only:
        description: "Run scraping and commit target data only; skip APIx, Gemini, Supabase, database, and Pages steps"
        required: false
        default: false
        type: boolean
      route_batch_size:
        description: "Routes per polite batch"
        required: false
        default: "5"
      batch_pause_seconds:
        description: "Pause between route batches"
        required: false
        default: "60"
      request_gap_seconds:
        description: "Minimum gap between Via API request starts"
        required: false
        default: "1.0"
      reset_client_between_batches:
        description: "Close and recreate the Via HTTP client after each route batch"
        required: false
        default: true
        type: boolean
      use_decodo_proxy:
        description: "Use the authorized DECODO_PROXY_URL secret for this run"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-apix-data
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      USE_DIRECT_API: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scraper dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        if: ${{ env.USE_DIRECT_API != 'true' }}
        run: python -m playwright install --with-deps chromium

      - name: Scrape all routes and advance windows
        env:
          # Keep rendered HTML out of the repository; only the text report is copied below.
          OUTPUT_FOLDER: /tmp/apix-scrape
          SHOW_BROWSER: "false"
          WAIT_MS: "1000"
          MAX_CONCURRENCY: "5"
          API_REQUEST_GAP_SECONDS: ${{ inputs.request_gap_seconds || '1.0' }}
          ROUTE_LIMIT: ${{ inputs.route_limit || '0' }}
          TOP_ROUTES: ${{ inputs.top_routes || '0' }}
          DATE_OFFSETS: ${{ inputs.offsets || '1,7,15,30,45' }}
          ROUTE_BATCH_SIZE: ${{ inputs.route_batch_size || '5' }}
          BATCH_PAUSE_SECONDS: ${{ inputs.batch_pause_seconds || '60' }}
          RESET_CLIENT_BETWEEN_BATCHES: ${{ inputs.reset_client_between_batches != false }}
          PROXY_URLS: ${{ inputs.use_decodo_proxy == true && secrets.DECODO_PROXY_URL || '' }}
          CHECKPOINT_OUTPUT: /tmp/apix-scrape/checkpoint.json
          DEBUG_EMPTY_RESULTS: ${{ inputs.debug_empty_results || 'false' }}
          EMPTY_RESULT_RETRIES: "0"
          SAVE_HTML: "false"
        run: python via/scraping/flight_scraper_multiplecities.py

      - name: Copy the fresh target report into the dashboard data folder
        run: |
          cp /tmp/apix-scrape/target_day.txt dashboard/target_day.txt
          cp /tmp/apix-scrape/target_day.json dashboard/target_day.json

      - name: Calculate APIx and write dashboard JSON
        if: ${{ inputs.scrape_only != true }}
        run: python cleaning/matchedmodel.py

      - name: Build rolling 30-day APIx history
        if: ${{ inputs.scrape_only != true }}
        run: python api/update_history.py

      - name: Generate Gemini daily briefing JSON
        if: ${{ inputs.scrape_only != true }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          python api/briefing.py
          dashboard/apix_output.json
          dashboard/target_day.json
          api/daily_briefing.json

      - name: Copy briefing JSON into the public dashboard artifact
        if: ${{ inputs.scrape_only != true }}
        run: |
          if [ ! -s api/daily_briefing.json ]; then
            printf '%s\n' '{"status":"unavailable","message":"Daily briefing is unavailable for this run."}' > api/daily_briefing.json
          fi
          cp api/daily_briefing.json dashboard/daily_briefing.json

      - name: Export GitHub Actions system logs
        if: ${{ inputs.scrape_only != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python api/system_logs.py dashboard/system_logs.json

      - name: Export daily database snapshots
        if: ${{ inputs.scrape_only != true }}
        run: python api/export_daily_database.py

      - name: Upsert daily data into Supabase
        if: ${{ inputs.scrape_only != true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python api/write_supabase.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/daily_briefing.json dashboard/apix_output.json dashboard/apix_history.json dashboard/target_day.txt dashboard/target_day.json dashboard/daily_briefing.json dashboard/system_logs.json database/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh daily APIx data"
            git push
          fi

      - name: Configure Pages
        if: ${{ inputs.scrape_only != true }}
        uses: actions/configure-pages@v5

      - name: Upload refreshed dashboard
        if: ${{ inputs.scrape_only != true }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard

      - name: Deploy refreshed dashboard
        if: ${{ inputs.scrape_only != true }}
        uses: actions/deploy-pages@v4
